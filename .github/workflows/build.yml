name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check package versions and tag
        run: python3 scripts/release.py validate
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_release.py'

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            binary: schematlas
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            binary: schematlas
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            binary: schematlas.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            binary: schematlas
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libssl-dev xdg-utils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Configure the ACP test interpreter
        run: python scripts/release.py python-env
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }},wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            ui -> target
          key: ${{ matrix.platform }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check the browser regression tests
        run: npm run check:tests
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Check the Leptos WASM frontend
        run: npm run check
      - name: Leptos formatting and lint
        run: |
          cargo fmt --manifest-path ui/Cargo.toml --check
          cargo clippy --locked --manifest-path ui/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked --manifest-path ui/Cargo.toml --all-targets -- -D warnings
      - name: Frontend tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Install browser for UI regression tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Leptos browser regressions
        if: runner.os == 'Linux'
        run: npm run test:e2e
      - name: Build native installers
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v') || vars.MACOS_SIGNING_ENABLED != 'true'
        env:
          NO_STRIP: 'true'
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Sign, notarize, and verify macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python scripts/macos_release.py validate
          npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          python scripts/macos_release.py verify
      - name: Smoke-test packaged agent tools
        timeout-minutes: 2
        run: python scripts/test-mcp-stdio.py src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Collect installers
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py collect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Verify assets, checksum, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: python3 scripts/release.py publish
