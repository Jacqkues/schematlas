[package]
name = "schematlas-parser"
version = "0.1.0"
description = "Read and surgically edit Mermaid (and later draw.io and DBML) diagrams, with Schematlas annotations kept inside the files"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[features]
default = ["formats"]
# The Mermaid, draw.io and DBML readers and writers. Without it the crate is the shared model
# (diagrams, edits, annotations) for clients that only display and request edits.
formats = ["dep:base64", "dep:dbml-rs", "dep:flate2", "dep:merman-core", "dep:pest", "dep:quick-xml"]

[dependencies]
base64 = { version = "0.22", optional = true }
dbml-rs = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
merman-core = { version = "0.9", default-features = false, features = ["diagram-flowchart", "diagram-class", "diagram-er", "diagram-state"], optional = true }
pest = { version = "2.9", optional = true }
quick-xml = { version = "0.38", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
insta = { version = "1", features = ["yaml", "glob"] }
