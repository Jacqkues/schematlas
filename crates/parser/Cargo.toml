[package]
name = "schematlas-parser"
version = "0.1.0"
description = "Read and surgically edit Mermaid (and later draw.io and DBML) diagrams, with Schematlas annotations kept inside the files"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
dbml-rs = "1"
flate2 = "1"
merman-core = { version = "0.9", default-features = false, features = ["diagram-flowchart", "diagram-class", "diagram-er", "diagram-state"] }
pest = "2.9"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
insta = { version = "1", features = ["yaml", "glob"] }
