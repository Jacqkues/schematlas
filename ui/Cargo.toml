[package]
name = "schematlas-ui"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlSelectElement", "HtmlAnchorElement", "DomRect", "PointerEvent",
  "MouseEvent", "KeyboardEvent", "WheelEvent", "Storage", "File", "FileList", "Blob", "BlobPropertyBag",
  "Url", "CssStyleDeclaration", "ScrollToOptions", "ScrollBehavior", "MediaQueryList", "EventTarget",
  "ResizeObserver", "ResizeObserverEntry", "SvgElement", "Node",
  "DedicatedWorkerGlobalScope", "MessageEvent", "AbortController", "AbortSignal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
console_error_panic_hook = "0.1"
uuid = { version = "1", features = ["v4", "js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
