[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false

[watch]
ignore = ["dist", "dist-dev", "public/app.css"]

# Tailwind scans the Rust sources; the generated stylesheet is served from public/.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["../scripts/leptos.mjs", "css"]
